name: Chromatic

# The desktop app's stories (desktop/src/*.stories.tsx), published to Chromatic for visual review.
# Without the CHROMATIC_PROJECT_TOKEN secret (a fork, or a repository not set up for it) the job
# says so and passes.

on:
  pull_request:
  push:
    branches: [next]

permissions:
  contents: read

jobs:
  chromatic:
    runs-on: ubuntu-latest
    env:
      CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
    steps:
      - name: Skip without a project token
        if: env.CHROMATIC_PROJECT_TOKEN == ''
        run: echo "CHROMATIC_PROJECT_TOKEN is not set; Chromatic is skipped."
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: env.CHROMATIC_PROJECT_TOKEN != ''
        with:
          fetch-depth: 0 # Chromatic compares with the builds of earlier commits
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        if: env.CHROMATIC_PROJECT_TOKEN != ''
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
        if: env.CHROMATIC_PROJECT_TOKEN != ''
        working-directory: desktop
      - uses: chromaui/action@latest
        if: env.CHROMATIC_PROJECT_TOKEN != ''
        with:
          workingDir: desktop
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          onlyChanged: true
          exitZeroOnChanges: true
