name: Windows sandbox

# What runs inside pine's AppContainer on Windows (src/pine-box.cs), tried one program at a time,
# so that a change to the sandbox helper shows at once what starts in it and what it can reach.
# The whole suite runs in the Test workflow; this is the quick look.

on:
  pull_request:
    paths: ["src/pine-box.cs", "src/sandbox-windows.ts", ".github/workflows/windows-sandbox.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Build pine-box with the compiler Windows carries
        shell: pwsh
        run: |
          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $csc /nologo /optimize+ /out:pine-box.exe src\pine-box.cs
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: What starts in an AppContainer, and what it reaches
        shell: pwsh
        run: |
          $box = (Resolve-Path .\pine-box.exe).Path
          $work = New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\boxwork"
          $outside = New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\outside"
          Set-Content "$outside\secret.txt" "SECRET"
          $bash = "C:\Program Files\Git\usr\bin\bash.exe"
          $node = (Get-Command node).Source
          function Probe($label, [string[]]$argv, [string[]]$more = @()) {
            $out = ("" | & $box box --name pine.ci.probe @more --write $work --read (Split-Path $node) --cwd $work -- @argv 2>&1 | Out-String).Trim() -replace "\r?\n", " | "
            if ($out.Length -gt 240) { $out = $out.Substring(0, 240) }
            "{0,-30} exit {1,11}  {2}" -f $label, $LASTEXITCODE, $out
          }
          $env:TMP = $work; $env:TEMP = $work; $env:HOME = $work.FullName
          Probe "cmd echo" @("cmd.exe", "/c", "echo hello")
          Probe "whoami /user" @("whoami.exe", "/user")
          Probe "node prints" @($node, "-e", "console.log('node ok')")
          Probe "node writes in its folder" @($node, "-e", "require('fs').writeFileSync('made.txt','x');console.log('wrote')")
          Probe "node reads outside" @($node, "-e", "console.log(require('fs').readFileSync(process.argv[1],'utf8'))", "$outside\secret.txt")
          Probe "node reaches the internet" @($node, "-e", "fetch('https://example.com').then(r=>console.log(r.status),e=>console.log('refused',e.cause?.code))")
          Probe "git --version" @("C:\Program Files\Git\cmd\git.exe", "--version")
          Probe "bash --version" @($bash, "--version")
          Probe "bash -c true" @($bash, "-c", "true")
          Probe "bash -c echo" @($bash, "-c", "echo bash ok; echo `$HOME `$TMP")
          Probe "bash -c ls" @($bash, "-c", "ls /usr/bin | head -3")
          Probe "sh -c echo" @("C:\Program Files\Git\usr\bin\sh.exe", "-c", "echo sh ok")
          Probe "Git bin\bash -c echo" @("C:\Program Files\Git\bin\bash.exe", "-c", "echo launcher ok")
          Probe "cat.exe a file" @("C:\Program Files\Git\usr\bin\cat.exe", "$work\made.txt")
          Probe "git --version, stdin open" @("C:\Program Files\Git\cmd\git.exe", "--version")
          Probe "git status in its folder" @("C:\Program Files\Git\cmd\git.exe", "-c", "safe.directory=*", "status", "--short")
          Probe "powershell" @("powershell.exe", "-NoProfile", "-NonInteractive", "-Command", "Get-ChildItem | Select -First 2 Name; 'ps ok'; `$env:USERPROFILE")
          Probe "pwsh" @("C:\Program Files\PowerShell\7\pwsh.exe", "-NoProfile", "-NonInteractive", "-Command", "'pwsh ok'; Set-Content x.txt 1; Get-Content x.txt")
          Probe "pwsh reads outside" @("C:\Program Files\PowerShell\7\pwsh.exe", "-NoProfile", "-Command", "Get-Content '$outside\secret.txt'")
          Probe "pwsh child node" @("C:\Program Files\PowerShell\7\pwsh.exe", "-NoProfile", "-Command", "& '$node' -e 'console.log(42)'")
          $server = Start-Job { & node -e "require('http').createServer((q,r)=>r.end('LOCAL')).listen(47123,'127.0.0.1')" }
          Start-Sleep 2
          Probe "with --net: the internet" @($node, "-e", "fetch('https://example.com').then(r=>console.log(r.status),e=>console.log('refused',e.cause?.code))") @("--net")
          Probe "with --net: this computer's loopback" @($node, "-e", "fetch('http://127.0.0.1:47123').then(r=>r.text()).then(console.log,e=>console.log('refused',e.cause?.code))") @("--net")
          Probe "no --net: loopback" @($node, "-e", "fetch('http://127.0.0.1:47123').then(r=>r.text()).then(console.log,e=>console.log('refused',e.cause?.code))")
          Stop-Job $server
          Probe "node opens NUL" @($node, "-e", "require('fs').closeSync(require('fs').openSync('\\\\.\\NUL','r+'));console.log('NUL ok')")
          Probe "cmd writes to nul" @("cmd.exe", "/c", "echo x > nul && echo nul ok")
          # Git's bash from a copy of its own, with the object folder its runtime asks for made by pine-box.
          $copy = "$env:RUNNER_TEMP\msys"
          robocopy "C:\Program Files\Git\usr\bin" "$copy\usr\bin" /E /NFL /NDL /NJH /NJS | Out-Null
          robocopy "C:\Program Files\Git\etc" "$copy\etc" /E /NFL /NDL /NJH /NJS | Out-Null
          $cbash = "$copy\usr\bin\bash.exe"
          $first = ("" | & $box box --name pine.ci.probe --read $copy --write $work --cwd $work -- $cbash -c "echo copy ok" 2>&1 | Out-String)
          "copy, as it is:  $($first.Trim())"
          if ($first -match 'NtCreateDirectoryObject\(([^)]+)\)') {
            $folder = $Matches[1]
            "the runtime asks for $folder"
            Probe "copy bash, with its objects" @($cbash, "-c", "echo bash ok; uname -a; ls | head -3; echo hi > b.txt; cat b.txt") @("--objects", $folder, "--read", $copy)
            Probe "copy bash runs node" @($cbash, "-c", "'$($node -replace '\\','/')' -e 'console.log(7*6)'") @("--objects", $folder, "--read", $copy)
            Probe "copy bash reads outside" @($cbash, "-c", "cat '$($outside -replace '\\','/')/secret.txt'") @("--objects", $folder, "--read", $copy)
          }
          Write-Output "--- ACL of Git's folders"
          icacls "C:\Program Files\Git\usr\bin\bash.exe"
          icacls "C:\Program Files\Git\usr\bin\msys-2.0.dll"
