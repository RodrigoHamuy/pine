name: Test

# pine's tests on every system it runs on, on every pull request and every push to next.
#
# pine: the type check and `npm test` on Linux (x64 and arm64), macOS and Windows. On Linux the
# sandbox is set up first the way an owner sets it up, with `pine init` (bubblewrap, and the
# AppArmor rule Ubuntu 24.04 needs), so that the tests that run commands in the sandbox run there
# and are not skipped. On Windows pine has no sandbox yet: those tests skip themselves, each with
# the reason why.
#
# The Pine app (desktop/): its tests drive the real app through its window, on macOS and on Linux
# under a virtual screen. They run when the app or the parts of pine it talks to change.

on:
  pull_request:
  push:
    branches: [next]

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pine:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, windows-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - run: npm run check
      - name: Set up the sandbox as pine init does
        if: runner.os == 'Linux'
        env:
          PINE_HOME: ${{ runner.temp }}/pine-home
          PINE_SKIP_DOWNLOADS: "1"
        run: node src/cli.ts init --yes
      - name: Say which sandbox the tests get
        shell: bash
        run: |
          node --input-type=module -e 'import { sandboxAvailable } from "./src/security.ts"; console.log(`sandbox: ${sandboxAvailable() ? "yes" : "none"} on ${process.platform}`)'
      - run: npm test

  desktop-changed:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.filter.outputs.changed }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: filter
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # A new branch or a forced push has no usable "before": then everything counts as changed.
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then echo "changed=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if git diff --name-only "$BASE" HEAD | grep -Eq '^(desktop/|src/(http|owner|service|remote)\.ts$|\.github/workflows/test\.yml$)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  desktop:
    needs: desktop-changed
    if: needs.desktop-changed.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: What Linux needs to build node-pty and to show a window
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 xvfb
          # Electron's own sandbox makes a user namespace, which Ubuntu 24.04 allows only to
          # programs with an AppArmor rule. A test runner has no reason to keep that restriction.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: npm ci
      - run: npm ci
        working-directory: desktop
      - run: npm run check
        working-directory: desktop
      - name: The app's tests
        if: runner.os == 'macOS'
        run: npm run desktop:test
      - name: The app's tests, on a virtual screen
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run desktop:test
