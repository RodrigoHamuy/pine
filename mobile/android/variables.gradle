ext {
    // 26 (Android 8), not Capacitor's 24: the plugin's core uses java.util.Base64, which Android has from 26.
    minSdkVersion = 26
    compileSdkVersion = 36
    targetSdkVersion = 36
    // The NDK whose strip tool takes the debug symbols out of libdatachannel (app/build.gradle). Without
    // this exact one installed, AGP packages the library as it is (about 30 MB per ABI instead of 3)
    // with a warning only: the release job installs it (release.yml).
    ndkVersion = '29.0.14206865'
    androidxActivityVersion = '1.11.0'
    androidxAppCompatVersion = '1.7.1'
    androidxCoordinatorLayoutVersion = '1.3.0'
    androidxCoreVersion = '1.17.0'
    androidxFragmentVersion = '1.8.9'
    coreSplashScreenVersion = '1.2.0'
    androidxWebkitVersion = '1.14.0'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.3.0'
    androidxEspressoCoreVersion = '3.7.0'
    cordovaAndroidVersion = '14.0.1'
}