// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // AGP 8.13 on Gradle 9.5 (gradle/wrapper): Gradle 9.5 is the newest an AGP 8 runs on, and the
        // first Gradle that both runs on JDK 25 (Android Studio's) and still has what AGP 8 uses.
        classpath 'com.android.tools.build:gradle:8.13.0'
        // The plugin is Kotlin, as the core it uses (../core) is: the same Kotlin.
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.4.21'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.layout.buildDirectory
}
