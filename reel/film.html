<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>pine film</title>
<style>
@font-face { font-family: "JBM"; src: url("assets/jetbrains-mono-latin.woff2") format("woff2"); font-weight: 100 800; }
/* pine's light colours (desktop/src/index.css), in a white room in daylight. */
:root {
	--room: #eef0ed; --bg: #fdfdfc; --surf: #ffffff; --raised: #f4f5f2; --sunk: #eff0ed; --side: #e9ebe6; --line: #e1e3de; --line2: #d3d6d0;
	--text: #1a1d1b; --muted: #666e68; --faint: #99a19b; --brand: #1f7a55; --brand-soft: rgba(31,122,85,.1); --warn: #a86a08; --bad: #c2413a; --info: #2a6fc0; --plan: #7c4fd0;
	--add: #1c7c4a; --add-bg: rgba(40,160,95,.14); --del: #b3382f; --del-bg: rgba(210,70,60,.12); --on-accent: #fff; --code: #3c433e;
	--hover: rgba(26,29,27,.07); --dot: #c3c7c0; --plan-soft: rgba(124,79,208,.12); --warn-soft: rgba(196,136,20,.14); --bad-soft: rgba(194,65,58,.1); --info-soft: rgba(42,111,192,.1);
	/* the sheets of the window (film-code.js) */
	--c-surf: #fff; --c-conv: #fdfdfc; --c-side: #e9ebe6; --c-panel: #f4f5f2; --c-back: #eef0ec; --c-bubble: #eceee9; --c-bubble-edge: #bfc5bd; --c-edge: #c9cec7;
	--c-green: #e3f1ea; --c-green-edge: #a9cdb8; --c-add: rgba(214,240,224,.96); --c-del: rgba(248,222,218,.96); --c-red: #f8e4e2; --c-red-edge: #e0b0aa;
	--c-amber: #f6eeda; --c-amber-edge: #dcc48f; --c-blue: #e2ecf8; --c-blue-edge: #aec6e6; --c-plan: #ece6f8; --c-plan-edge: #c3b3e6; --c-brand-edge: #14573c;
	--c-bar-add: rgba(40,160,95,.4); --c-bar-del: rgba(210,70,60,.35); --c-bar-del-soft: rgba(194,65,58,.25); --c-track: rgba(26,29,27,.08);
	--g-surf: 255,255,255; --g-brand: 31,122,85; --g-shadow: 38,50,44; --g-ghost: 255,255,255;
	--sh-edge: inset 0 1.5px 0 rgba(255,255,255,.95), inset 0 0 0 1px rgba(26,29,27,.06); --sh-line: inset 0 0 0 1px rgba(26,29,27,.07);
	--sans: -apple-system, "SF Pro Display", "Helvetica Neue", sans-serif; --mono: "JBM", Menlo, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: #d9dcd7; overflow: hidden; }
#stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--room); transform-origin: 0 0; font-family: var(--sans); color: var(--text); -webkit-font-smoothing: antialiased; }
#film, .sub, .space, .hud, .sky, .over, .tilt { position: absolute; inset: 0; }
.sub { background: var(--room); overflow: hidden; }
.space { perspective: 1800px; perspective-origin: 50% 50%; overflow: hidden; }
.world, .station, .st, .d3 { transform-style: preserve-3d; }
.world { position: absolute; left: 960px; top: 540px; width: 0; height: 0; transform-origin: 0 0; }
.station { position: absolute; left: 0; top: 0; width: 0; height: 0; }
.st { position: absolute; left: -960px; top: -540px; width: 1920px; height: 1080px; }
.st div { position: absolute; }
i, b, u, s, em { font-style: normal; text-decoration: none; }
p, h6 { margin: 0; }
#grain { position: absolute; inset: 0; pointer-events: none; opacity: .035; z-index: 21; mix-blend-mode: multiply; }
#scrub { display: none; position: fixed; left: 0; right: 0; bottom: 0; height: 30px; background: #111; cursor: pointer; z-index: 99; }
#scrub i { display: block; height: 100%; background: #2b6; opacity: .5; }
#scrub span { position: absolute; left: 10px; top: 6px; font: 13px Menlo, monospace; color: #fff; }

/* ---- the room: a white wall in daylight, and the shadow of a window on it ---- */
.sky { background: linear-gradient(178deg, #f9faf8 0%, #f1f3f0 46%, #e3e6e1 100%); overflow: hidden; }
.sky div { position: absolute; }
.sky .sun { filter: blur(46px); }
.tilt { pointer-events: none; }

/* ---- type ---- */
.kin { white-space: pre; }
.kin .kw { display: inline-block; overflow: hidden; vertical-align: bottom; padding: 0 .04em .12em; margin: 0 -.04em -.12em; white-space: pre; }
.kin .kw i { display: inline-block; }
.h1 { font: 700 132px/1 var(--sans); letter-spacing: -.045em; white-space: pre; color: var(--text); }
.mono { font-family: var(--mono); font-variant-ligatures: none; }
.brand { color: var(--brand); } .muted { color: var(--muted); } .faint { color: var(--faint); } .bad { color: var(--bad); } .warn { color: var(--warn); } .info { color: var(--info); } .plan { color: var(--plan); }

/* ---- what lies over the picture ---- */
.hud { pointer-events: none; }
.hud > * { position: absolute; }
.hud .logo { display: block; width: 100px; height: 23px; }
.hud .veil { left: 0; bottom: 0; width: 1500px; height: 420px; background: radial-gradient(ellipse 100% 100% at 0% 100%, rgba(247,248,246,.96) 0, rgba(247,248,246,.86) 38%, rgba(247,248,246,0) 72%); }
.hud .cap { left: 72px; bottom: 60px; }
.hud .cap .t { font: 700 50px/1.1 var(--sans); letter-spacing: -.03em; color: var(--text); white-space: pre; }
.hud .cap .s { margin-top: 10px; font: 500 26px/1.3 var(--sans); letter-spacing: -.005em; color: var(--muted); white-space: pre; }
.hud .cmd { right: 72px; bottom: 62px; height: 60px; padding: 0 24px 0 20px; border-radius: 16px; background: rgba(255,255,255,.92); box-shadow: 0 0 0 1px rgba(26,29,27,.07), 0 14px 40px rgba(40,52,46,.16), 0 2px 6px rgba(40,52,46,.08); font: 500 25px/60px var(--mono); color: var(--text); white-space: pre; }
.hud .cmd em { color: var(--brand); margin-right: 12px; font-weight: 700; } .hud .cmd .ct { display: inline-block; width: 11px; height: 27px; margin: 0 0 -5px 2px; background: var(--brand); }
.hud .keys { right: 72px; bottom: 62px; display: flex; gap: 12px; }
.kbd { display: inline-block; min-width: 60px; height: 60px; padding: 0 20px; border-radius: 13px; background: linear-gradient(#fff, #f1f3ef); box-shadow: 0 0 0 1px rgba(26,29,27,.1), 0 5px 0 #cfd3cc, 0 14px 30px rgba(40,52,46,.18); font: 600 23px/58px var(--mono); color: var(--text); text-align: center; }

/* ---- pieces of pine's interface, light ---- */
.pl { overflow: hidden; }
.lights { left: 22px; top: 22px; display: flex; gap: 9px; } .lights b { display: block; width: 14px; height: 14px; border-radius: 50%; }
.lights b:nth-child(1) { background: #ee6a5f; } .lights b:nth-child(2) { background: #f5bd4f; } .lights b:nth-child(3) { background: #61c454; }
.sb p { height: 46px; padding: 0 14px; margin: 0 10px; border-radius: 10px; font: 500 20.5px/46px var(--sans); color: var(--muted); white-space: pre; overflow: hidden; }
.sb p.on { background: var(--hover); color: var(--text); } .sb p s { display: inline-block; width: 9px; height: 9px; margin: 0 12px 2px 2px; border-radius: 50%; background: var(--dot); } .sb p.on s { background: var(--brand); }
.sb h6 { margin: 20px 24px 8px; font: 600 14.5px/1 var(--mono); letter-spacing: .16em; color: var(--faint); }
.hd { font: 650 21px/58px var(--sans); white-space: pre; color: var(--text); }
.chip { display: inline-block; height: 32px; padding: 0 12px; border-radius: 9px; background: var(--sunk); font: 500 17.5px/32px var(--mono); color: var(--muted); white-space: pre; vertical-align: 1px; }
.chip.br { background: var(--brand-soft); color: var(--brand); font-weight: 600; }
.um { font: 500 22.5px/52px var(--sans); color: var(--text); white-space: pre; padding: 0 20px; }
.tool { font: 500 20px/38px var(--mono); color: var(--muted); white-space: pre; padding: 0 12px; }
.tool b { color: var(--text); font-weight: 700; } .tool em { color: var(--faint); } .tool .ok { color: var(--brand); font-weight: 700; } .tool .run { color: var(--warn); display: inline-block; width: 21px; }
.ans { font: 400 22.5px/34px var(--sans); color: var(--text); white-space: pre; padding: 0 12px; }
.pill { display: inline-block; height: 30px; padding: 0 12px; border-radius: 15px; font: 600 16.5px/30px var(--mono); background: var(--brand-soft); color: var(--brand); white-space: pre; }
.pill.gr { background: var(--hover); color: var(--muted); } .pill.pl2 { background: var(--plan-soft); color: var(--plan); } .pill.wn { background: var(--warn-soft); color: var(--warn); } .pill.bd { background: var(--bad-soft); color: var(--bad); } .pill.inf { background: var(--info-soft); color: var(--info); }
.ph { color: var(--faint); }
.ct { display: inline-block; width: 2.5px; height: 26px; margin: 0 0 -5px 2px; background: var(--brand); }
.tabs { font: 600 19px/36px var(--sans); color: var(--faint); white-space: pre; }
.tabs u { display: inline-block; height: 36px; padding: 0 14px; border-radius: 9px; margin-right: 2px; } .tabs u.on { background: var(--hover); color: var(--text); }
.fr { font: 500 20px/42px var(--mono); color: var(--text); white-space: pre; padding: 0 16px; }
.fr k { display: inline-block; width: 30px; font-weight: 700; } .fr .p { color: var(--add); margin-left: 14px; } .fr .m { color: var(--del); margin-left: 8px; }
.sw { display: inline-block; height: 32px; padding: 0 12px; border-radius: 8px; font: 600 16.5px/32px var(--mono); color: var(--faint); white-space: pre; } .sw.on { background: var(--brand-soft); color: var(--brand); }
.dl { font: 500 19px/31px var(--mono); white-space: pre; color: var(--code); padding-left: 14px; }
.dl n { display: inline-block; width: 40px; color: var(--faint); }
.dl .k { color: var(--plan); } .dl .s { color: var(--add); } .dl .f { color: var(--info); }
.br { display: inline-block; width: .86em; height: .86em; vertical-align: -.08em; margin-right: .3em; }
.btn { border-radius: 10px; background: var(--brand); color: var(--on-accent); font: 650 20px/44px var(--sans); text-align: center; white-space: pre; }
.btn.gh { background: var(--surf); color: var(--text); box-shadow: inset 0 0 0 1px var(--line2); }
.lab { font: 600 16px/1 var(--mono); letter-spacing: .16em; color: var(--faint); white-space: pre; }
.note { font: 500 20px/1.55 var(--mono); color: var(--text); white-space: pre; padding: 14px 18px; }
.cursor { width: 34px; height: 34px; }
.ring { width: 64px; height: 64px; margin: -32px 0 0 -32px; border-radius: 50%; border: 3px solid var(--brand); }
.tile { background: #1a1d1b; border-radius: 3px; }
</style>
</head>
<body>
<div id="stage">
	<div id="film"></div>
	<svg id="grain" width="1920" height="1080"><filter id="gf" x="0" y="0" width="100%" height="100%"><feTurbulence id="grainseed" type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="1" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="1920" height="1080" filter="url(#gf)"/></svg>
</div>
<div id="scrub"><i></i><span></span></div>
<script src="film.js"></script>
<script>
	// ?film=code plays film-code.js.
	const named = new URLSearchParams(location.search).get("film");
	document.write(`<script src="film-${named && /^[a-z0-9-]+$/.test(named) ? named : "code"}.js"><\/script>`);
</script>
<script>play();</script>
</body>
</html>
