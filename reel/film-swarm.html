<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>pine film: boards and swarms</title>
<style>
@font-face { font-family: "JBM"; src: url("assets/jetbrains-mono-latin.woff2") format("woff2"); font-weight: 100 800; }
:root { --ink: #1b2230; --soft: #5b6577; --brand: #1fae8f; --sans: -apple-system, "SF Pro Display", "Helvetica Neue", sans-serif; --mono: "JBM", Menlo, monospace; }
* { box-sizing: border-box; }
html, body { margin: 0; background: #cfd4d8; overflow: hidden; }
#stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; transform-origin: 0 0; font-family: var(--sans); color: var(--ink); -webkit-font-smoothing: antialiased; background: #f4f2ee; }
/* The room: daylight, and a few large soft shapes that move a little when the camera does. */
#wall { position: absolute; inset: -120px; background:
	radial-gradient(1300px 760px at 10% 104%, #ffd9b8 0, rgba(255,217,184,0) 62%),
	radial-gradient(1200px 800px at 96% 96%, #b9e3d2 0, rgba(185,227,210,0) 60%),
	radial-gradient(1000px 680px at 72% -6%, #cfe0ff 0, rgba(207,224,255,0) 64%),
	radial-gradient(820px 560px at 20% 2%, #e7dcff 0, rgba(231,220,255,0) 62%),
	linear-gradient(170deg, #eaf2fb 0%, #f5f3ef 55%, #f8ede3 100%); }
#wall i { position: absolute; border-radius: 50%; filter: blur(2px); }
#space { position: absolute; inset: 0; perspective: 2600px; perspective-origin: 960px 470px; }
#world { position: absolute; left: 0; top: 0; width: 3720px; height: 2340px; transform-origin: 0 0; transform-style: preserve-3d; will-change: transform; }
/* pine's window: a picture of the real one. Everything in the world is laid out three times its size, a pixel of
   the picture to a pixel of the page, and the camera makes it smaller: a part the camera goes close to stays sharp. */
#win { position: absolute; left: 0; top: 0; width: 3720px; height: 2340px; border-radius: 36px; overflow: hidden; background: #1b1e28; box-shadow: 0 0 0 3px rgba(10,12,20,.5), 0 150px 330px rgba(30,40,70,.38), 0 36px 90px rgba(30,40,70,.22); }
#win img { position: absolute; left: 0; top: 0; width: 3720px; height: 2340px; display: block; }
#lights { position: absolute; left: 42px; top: 39px; }
#lights i { position: absolute; top: 0; width: 36px; height: 36px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px rgba(0,0,0,.2); }
/* A part of the window lifted off it: the same picture, cut to that part, on a sheet of its own. */
.lift { position: absolute; left: 0; top: 0; transform-origin: 0 0; overflow: hidden; border-radius: 30px; background: #1b1e28; box-shadow: 0 0 0 3px rgba(255,255,255,.08) inset, 0 0 0 3px rgba(10,12,20,.45), 0 60px 150px rgba(20,28,50,.45), 0 15px 40px rgba(20,28,50,.28); }
.lift img { position: absolute; width: 3720px; height: 2340px; display: block; }
.ghost { position: absolute; border-radius: 24px; box-shadow: 0 0 0 4px rgba(93,228,199,.55); }
/* The game the swarm wrote, running. */
#game { position: absolute; left: 0; top: 0; transform-origin: 0 0; padding: 21px; border-radius: 42px; background: #fff; box-shadow: 0 0 0 3px rgba(20,28,50,.1), 0 90px 210px rgba(20,28,50,.4), 0 24px 54px rgba(20,28,50,.22); }
#game canvas { display: block; width: 1920px; height: 1080px; border-radius: 24px; }
#game b { position: absolute; left: 48px; top: -112px; font: 650 60px/84px var(--sans); color: var(--ink); background: #fff; padding: 4px 36px; border-radius: 28px; white-space: pre; box-shadow: 0 12px 42px rgba(20,28,50,.18); }
/* What a shot says, under the picture. */
#cap { z-index: 6; position: absolute; left: 0; right: 0; bottom: 46px; text-align: center; font: 600 46px/1.25 var(--sans); letter-spacing: -.01em; color: var(--ink); white-space: pre; }
#cap span { display: inline-block; padding: 12px 32px 14px; border-radius: 26px; background: rgba(255,255,255,.9); backdrop-filter: blur(24px) saturate(1.4); box-shadow: 0 10px 34px rgba(20,28,50,.2), 0 0 0 1px rgba(20,28,50,.06); }
#cap code { font: 600 42px var(--mono); background: rgba(27,34,48,.08); padding: 2px 12px; border-radius: 10px; }
#cap em { font-style: normal; color: var(--brand); }
#part { position: absolute; left: 50px; top: 40px; font: 650 30px/52px var(--sans); color: var(--ink); background: rgba(255,255,255,.78); padding: 0 24px; border-radius: 26px; white-space: pre; box-shadow: 0 6px 20px rgba(30,40,70,.14); z-index: 5; }
#part i { font-style: normal; color: var(--soft); font-weight: 500; }
/* The cards at the start and the end. */
#title { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; text-align: center; }
#title img { width: 420px; height: auto; filter: invert(1) brightness(.2); }
#title h1 { margin: 34px 0 0; font: 700 104px/1.05 var(--sans); letter-spacing: -.035em; }
#title p { margin: 22px 0 0; font: 500 40px/1.3 var(--sans); color: var(--soft); white-space: pre; }
#title code { font: 600 36px var(--mono); color: var(--ink); background: rgba(27,34,48,.08); padding: 2px 14px; border-radius: 10px; }
#scrub { display: none; position: fixed; left: 0; right: 0; bottom: 0; height: 30px; background: #111; cursor: pointer; z-index: 99; }
#scrub i { display: block; height: 100%; background: #2b6; opacity: .5; }
#scrub span { position: absolute; left: 10px; top: 6px; font: 13px Menlo, monospace; color: #fff; }
</style>
</head>
<body>
<div id="stage">
	<div id="wall"></div>
	<div id="space"><div id="world"><div id="win"><img id="shot" alt=""><div id="lights"><i style="left:0;background:#ff5f57"></i><i style="left:20px;background:#febc2e"></i><i style="left:40px;background:#28c840"></i></div></div><div id="lifts"></div><div id="game"><b></b><canvas width="1920" height="1080"></canvas></div></div></div>
	<div id="part"></div>
	<div id="cap"></div>
	<div id="title"><img src="assets/logo.svg" alt=""><h1></h1><p></p></div>
</div>
<div id="scrub"><i></i><span></span></div>
<!-- The pictures of the real app and the game the first swarm wrote: `node reel/swarm-shots.mjs` makes these. -->
<script src="assets/swarm/shots-pelican.js"></script>
<script src="assets/swarm/shots-shop.js"></script>
<script src="assets/swarm/game.js"></script>
<script src="film-swarm.js"></script>
</body>
</html>
