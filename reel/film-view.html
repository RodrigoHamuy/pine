<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>pine film: the view</title>
<style>
@font-face { font-family: "JBM"; src: url("assets/jetbrains-mono-latin.woff2") format("woff2"); font-weight: 100 800; }
/* pine's own dark colours (desktop/src/index.css, the theme it comes with). */
:root {
	--bg: #1b1e28; --surf: #1b1e28; --raised: #232633; --sunk: #171922; --side: #262936; --line: #2b2e3c; --line2: #3a3e50;
	--text: #e4f0fb; --muted: #a6accd; --faint: #767c9d; --brand: #5de4c7; --brand-soft: #5de4c71f; --on-accent: #171922; --warn: #fffac2; --bad: #d0679d; --info: #add7ff;
	--hover: #a6accd12; --press: #a6accd1f; --sans: -apple-system, "SF Pro Text", "Helvetica Neue", sans-serif; --mono: "JBM", Menlo, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: #cfd4d8; overflow: hidden; }
#stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; transform-origin: 0 0; font-family: var(--sans); color: var(--text); -webkit-font-smoothing: antialiased; background: #fff; }
#cam { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; will-change: transform; }
#cam div, #cam span, #cam i, #cam b { position: absolute; }
i, b { font-style: normal; font-weight: inherit; }
svg { display: block; }

/* ---- the desk: a wallpaper of its own, a menu bar, a dock ---- */
#wall { inset: 0; background:
	radial-gradient(1200px 700px at 12% 108%, #ffd9b8 0, rgba(255,217,184,0) 62%),
	radial-gradient(1100px 760px at 96% 96%, #b9e3d2 0, rgba(185,227,210,0) 60%),
	radial-gradient(900px 620px at 70% -8%, #cfe0ff 0, rgba(207,224,255,0) 64%),
	radial-gradient(760px 520px at 22% 4%, #e7dcff 0, rgba(231,220,255,0) 62%),
	linear-gradient(170deg, #eaf2fb 0%, #f3f1ee 55%, #f7ece2 100%); }
#wall .hill { left: -10%; width: 120%; border-radius: 50% 50% 0 0 / 100% 100% 0 0; }
#menubar { left: 0; top: 0; width: 1920px; height: 30px; background: rgba(255,255,255,.55); backdrop-filter: blur(30px) saturate(1.6); font: 500 14px/30px var(--sans); color: #1d2420; }
#menubar b { top: 0; white-space: pre; }
#dock { left: 50%; bottom: 10px; height: 74px; transform: translateX(-50%); padding: 0 9px; border-radius: 20px; background: rgba(255,255,255,.42); backdrop-filter: blur(28px) saturate(1.5); box-shadow: 0 0 0 1px rgba(255,255,255,.55) inset, 0 12px 40px rgba(40,60,80,.18); }
#dock .app { top: 8px; width: 56px; height: 56px; border-radius: 14px; box-shadow: 0 3px 8px rgba(30,40,60,.22), inset 0 1px 0 rgba(255,255,255,.5); }
#dock .app i { inset: 0; display: grid; place-items: center; position: absolute; }
#dock .dot { bottom: 2px; width: 4px; height: 4px; border-radius: 50%; background: rgba(30,40,50,.6); }

/* ---- pine's window ---- */
#win { transform-origin: 0 0; border-radius: 13px; background: var(--side); color: var(--text); box-shadow: 0 0 0 1px rgba(10,12,20,.55), inset 0 0 0 1px rgba(255,255,255,.07), 0 38px 90px rgba(20,30,50,.45), 0 8px 22px rgba(20,30,50,.25); overflow: hidden; font-size: 14px; }
.lights i { top: 16px; width: 13px; height: 13px; border-radius: 50%; box-shadow: inset 0 0 0 .5px rgba(0,0,0,.18); }
.icon { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 7px; color: var(--muted); }
.icon.on { background: var(--press); color: var(--text); }
.icon svg { width: 16px; height: 16px; }
.tab { top: 8px; height: 30px; border-radius: 8px; padding: 0 12px 0 28px; font: 500 13.5px/30px var(--sans); white-space: pre; color: var(--muted); }
.tab.on { background: var(--surf); color: var(--text); box-shadow: 0 0 0 1px rgba(255,255,255,.05); }
.tab u { position: absolute; left: 11px; top: 11px; width: 8px; height: 8px; border-radius: 50%; background: var(--faint); }
.tab.busy u { background: var(--brand); }
.row { left: 8px; width: 232px; height: 32px; border-radius: 8px; font: 14px/32px var(--sans); white-space: pre; }
.row.sel { background: var(--press); }
.row .av { left: 30px; top: 5px; width: 22px; height: 22px; border-radius: 50%; color: #fff; font: 700 11px/22px var(--sans); text-align: center; }
.row .name { left: 60px; top: 0; font-weight: 650; }
.row .desc { top: 0; color: var(--faint); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; }
.row .chev { left: 8px; top: 9px; color: var(--faint); }
.row .chev svg, .row .plus svg { width: 14px; height: 14px; }
.row .plus { right: 8px; top: 9px; color: var(--faint); }
.row .star { left: 34px; top: 9px; color: var(--faint); }
.row .star svg { width: 14px; height: 14px; }
.row .live { left: 38px; top: 13px; width: 7px; height: 7px; border-radius: 50%; background: var(--brand); }
.row .sub { left: 60px; top: 0; color: var(--muted); }
.kbd { font: 500 11px/18px var(--sans); padding: 0 5px; border-radius: 5px; background: var(--press); color: var(--muted); }
.card { background: var(--surf); border-radius: 11px; box-shadow: 0 0 0 1px rgba(255,255,255,.04); overflow: hidden; }
.head { left: 0; top: 0; right: 0; height: 40px; font: 500 13.5px/40px var(--sans); }
/* The conversation: its blocks lie one under the other, the newest at the bottom; a new one opens up. */
#cam #chat { display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden; padding: 0 0 10px; }
#cam #chat *, #cam #status * { position: static; }
#cam #chat .answer p { position: relative; }
#chat .blk { display: grid; flex: none; }
#chat .blk > .in { min-height: 0; overflow: hidden; padding-top: 11px; }
#chat .blk.me > .in { display: flex; justify-content: flex-end; padding-top: 16px; }
.msg { max-width: 400px; padding: 9px 14px; border-radius: 14px 14px 4px 14px; background: var(--raised); box-shadow: inset 0 0 0 1px var(--line); font: 14.5px/1.45 var(--sans); }
.event { padding: 8px 12px 9px; border-radius: 10px; background: var(--sunk); box-shadow: inset 0 0 0 1px var(--line); font: 14px/1.45 var(--sans); color: var(--muted); }
.event .from { display: flex; align-items: center; gap: 7px; margin-bottom: 2px; font: 600 12px/1.5 var(--sans); color: var(--faint); letter-spacing: .01em; }
.event .from i { width: 7px; height: 7px; border-radius: 50%; flex: none; }
.work { display: flex; align-items: center; gap: 10px; font: 13.5px/1.5 var(--sans); color: var(--muted); white-space: pre; }
.work .dot { flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
.work .dot.go { background: var(--brand); }
.work code { font: 13px var(--mono); color: var(--text); }
.answer { font: 14.5px/1.5 var(--sans); color: var(--text); }
.answer h4 { margin: 10px 0 3px; font: 650 14.5px/1.4 var(--sans); }
.answer p { margin: 0 0 3px; position: relative; padding-left: 16px; }
.answer p::before { content: ""; position: absolute; left: 3px; top: 9px; width: 5px; height: 5px; border-radius: 50%; background: var(--faint); }
.answer p.lead { padding-left: 0; }
.answer p.lead::before { display: none; }
.answer b { font-weight: 650; }
.answer code { font: 13px var(--mono); background: var(--raised); padding: 1px 5px; border-radius: 5px; }
.composer { border-radius: 14px; background: #1e212c; box-shadow: 0 0 0 1px var(--line), 0 6px 22px rgba(8,10,16,.35); }
.composer .text { left: 16px; top: 14px; font: 15px/1.4 var(--sans); white-space: pre; }
.composer .caret { width: 1.5px; height: 19px; background: var(--brand); }
.composer .send { right: 12px; bottom: 11px; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; color: var(--on-accent); }
.composer .send svg { width: 16px; height: 16px; }
.feed { font: 12.5px/22px var(--sans); white-space: pre; }
.feed .ago { left: 14px; width: 30px; text-align: right; color: var(--faint); font-variant-numeric: tabular-nums; }
.feed .what { left: 54px; right: 12px; overflow: hidden; text-overflow: ellipsis; }
#view-root { left: 0; top: 40px; height: 700px; overflow: hidden; background: #8ec4ee; }
#cursor { width: 24px; height: 24px; z-index: 50; filter: drop-shadow(0 2px 3px rgba(0,0,0,.35)); }
#ring { width: 0; height: 0; z-index: 49; }
#ring i { left: 0; top: 0; border-radius: 50%; border: 2px solid rgba(93,228,199,.85); transform: translate(-50%, -50%); }
#fade { position: absolute; inset: 0; background: #12141b; opacity: 0; pointer-events: none; z-index: 80; }
/* The robot of the opening: its own few pixels, made big. */
#bot { position: absolute; left: 456px; top: 50px; width: 1064px; height: 980px; image-rendering: pixelated; }
#scrub { display: none; position: fixed; left: 0; right: 0; bottom: 0; height: 30px; background: #111; cursor: pointer; z-index: 99; }
#scrub i { display: block; height: 100%; background: #2b6; opacity: .5; }
#scrub span { position: absolute; left: 10px; top: 6px; font: 13px Menlo, monospace; color: #fff; }
</style>
</head>
<body>
<div id="stage"><div id="cam"></div><div id="fade"></div></div>
<div id="scrub"><i></i><span></span></div>
<!-- The office view and the module it imports, as text: `node reel/render.mjs --film view` writes this file. -->
<script src="view-code.js"></script>
<script src="film-view.js"></script>
</body>
</html>
